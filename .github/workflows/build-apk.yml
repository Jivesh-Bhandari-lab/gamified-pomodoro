name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK environment
      # The GitHub Ubuntu runner already contains the Android SDK.
      # We only initialize the Android environment here.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Verify Android tools
      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          node --version
          npm --version
          adb version
          sdkmanager --version

      # 6. Install project dependencies
      - name: Install web dependencies
        run: npm install

      # 7. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      # 8. Build Next.js static website
      - name: Build Next.js application
        run: npm run build

      # 9. Create Capacitor configuration
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.focusquest.app",
            "appName": "FocusQuest",
            "webDir": "out"
          }
          EOF

      # 10. Add Android platform
      - name: Add Android platform
        run: npx cap add android

      # 11. Copy web application into Android project
      - name: Sync Capacitor
        run: npx cap sync android

      # 12. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 13. Build APK
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusQuest-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
