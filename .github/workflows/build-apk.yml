name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 5. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 6. Verify environment
      - name: Verify build environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Java:"
          java -version

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Android SDK:"
          sdkmanager --version

          echo "ADB:"
          adb version

      # 7. Install web dependencies
      - name: Install web dependencies
        run: npm install

      # 8. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      # 9. Build Next.js application
      - name: Build Next.js application
        run: npm run build

      # 10. Verify Next.js output
      - name: Verify web build
        run: |
          if [ ! -d "out" ]; then
            echo "ERROR: Next.js did not create the out directory."
            exit 1
          fi

          echo "Next.js static export created successfully."
          ls -la out

      # 11. Create Capacitor configuration
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.focusquest.app",
            "appName": "FocusQuest",
            "webDir": "out"
          }
          EOF

      # 12. Add Android platform
      - name: Add Android platform
        run: npx cap add android

      # 13. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 14. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 15. Build APK
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 16. Verify APK
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      # 17. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusQuest-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
