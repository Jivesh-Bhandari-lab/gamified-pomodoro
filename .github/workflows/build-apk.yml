name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Install Capacitor Core & CLI
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Config
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init FocusQuest com.focusquest.app --web-dir=out
          fi

      - name: Build Web Application
        run: npm run build

      - name: Create Android Project Structure
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: FocusQuest-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
